name: Build Dirty Trap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Dirty_Trap_GitHub_Actions_APK_Project.zip -d project
          cd project
          find . -maxdepth 2 -type f | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dirty-Trap-WhatsApp-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
